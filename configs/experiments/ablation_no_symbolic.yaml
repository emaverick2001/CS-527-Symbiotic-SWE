experiment:
  name: ablation-no-symbolic
  description: Run the same repair loop while disabling symbolic checks and feedback.
  seed: 0
  max_iterations: 2

pipeline:
  stages:
    - retrieval
    - patch_generation
    - evaluation
  symbolic_feedback_enabled: false

artifacts:
  run_id_template: "{date}_{agent}_{experiment}_{solver}_{seed}"
  root: artifacts/runs
