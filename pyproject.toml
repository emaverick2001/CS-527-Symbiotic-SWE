[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cs-527-symbiotic-swe"
version = "0.1.0"
description = "CS-527 Symbiotic SWE Project"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "anthropic>=0.64.0",
    "openai>=1.109.0",
    "pydantic>=2.8.2",
    "pytest>=8.2.2",
    "z3-solver>=4.13.0",
    "mypy>=1.10.1",
    "beartype>=0.17.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.14.0",
    "pytest-asyncio>=0.23.7",
    "ruff>=0.3.7",
    "mypy>=1.10.1",
    "pre-commit>=3.8.0",
    "commitizen>=3.31.0",
    "nbmake>=1.5.4",
    "ipykernel>=6.29.5",
]

test = [
    "pytest>=8.2.2",
    "pytest-cov>=4.1.0",
    "coverage[toml]>=7.6.12",
    "hypothesis>=6.126.0",
]

swebench = [
    "Cython>=0.29.37,<3.0.0",
    "cycler>=0.12.1",
    "joblib>=1.4.2",
    "kiwisolver>=1.4.5",
    "mpmath>=1.3.0",
    "numpy>=1.26.4,<2.0.0",
    "pillow>=10.4.0",
    "pyparsing>=3.1.2",
    "pytest-rerunfailures>=14.0",
    "pytest-timeout>=2.3.1",
    "pytest-xdist>=3.6.1",
    "scipy>=1.11.4",
    "setuptools>=59.8.0,<83.0.0",
    "setuptools-scm>=8.1.0",
    "threadpoolctl>=3.5.0",
    "wheel>=0.44.0",
]

[project.scripts]
symbiotic-swe = "symbiotic_swe.cli:main"
symbiotic-swe-dataset = "symbiotic_swe.dataset.commands:main"

[tool.hatch.build.targets.wheel]
packages = ["symbiotic_swe"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    "data/prepared/workspaces",
    "data/raw/repositories",
    "artifacts/workspaces",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["datasets"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["."]
addopts = "-v --cov=symbiotic_swe --cov-report=term-missing"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["symbiotic_swe"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
