[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cs-527-symbiotic-swe"
version = "0.1.0"
description = "CS-527 Symbiotic SWE Project"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "pydantic>=2.8.2",
    "mypy>=1.10.1",
    "beartype>=0.17.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.14.0",
    "pytest-asyncio>=0.23.7",
    "ruff>=0.3.7",
    "mypy>=1.10.1",
    "pre-commit>=3.8.0",
    "commitizen>=3.31.0",
    "nbmake>=1.5.4",
    "ipykernel>=6.29.5",
]

test = [
    "pytest>=8.2.2",
    "pytest-cov>=4.1.0",
    "coverage[toml]>=7.6.12",
    "hypothesis>=6.126.0",
]

[project.scripts]
symbiotic-swe = "symbiotic_swe.cli:main"
symbiotic-swe-dataset = "symbiotic_swe.dataset.commands:main"

[tool.hatch.build.targets.wheel]
packages = ["symbiotic_swe", "src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["datasets"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["src", "."]
addopts = "-v --cov=symbiotic_swe --cov-report=term-missing"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
